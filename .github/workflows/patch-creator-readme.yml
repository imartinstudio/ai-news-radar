name: Patch Creator README

on:
  push:
    branches:
      - feat/ai-coding-intelligence-v1
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/ai-coding-intelligence-v1

      - name: Patch README precisely
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("README.md")
          text = path.read_text(encoding="utf-8")
          marker = "## AI Coding 创作者版"
          if marker in text:
              print("README already patched")
              raise SystemExit(0)

          replacements = [
              (
                  "[English](README.en.md) · [雷达Skill](skills/radar/README.md) · [伯乐Skill](skills/ai-news-radar/README.md) · [信息源策略](docs/SOURCE_COVERAGE.md)",
                  "[English](README.en.md) · [AI Coding 创作者版](creator/) · [创作者配置](docs/CREATOR_PIPELINE.md) · [雷达Skill](skills/radar/README.md) · [伯乐Skill](skills/ai-news-radar/README.md) · [信息源策略](docs/SOURCE_COVERAGE.md)",
              ),
              (
                  "---\n\n## 30秒选边上车",
                  "---\n\n## AI Coding 创作者版\n\n本 Fork 增加一条面向个人研究和内容创作的 AI Coding 情报管线：每天北京时间 **08:17 / 20:47** 生成早报和晚报，每期筛选 8–12 条高价值信息，并输出事实摘要、为什么重要以及适合 X、小红书、公众号的选题角度。\n\n- 创作者归档页：[`/creator/`](creator/)\n- 完整配置与故障恢复：[`docs/CREATOR_PIPELINE.md`](docs/CREATOR_PIPELINE.md)\n- 默认使用 DeepSeek-compatible API；无 Key 或超额时自动使用规则降级\n- Telegram 推送需要配置 `TELEGRAM_BOT_TOKEN` 和 `TELEGRAM_CHANNEL_ID`\n- 所有密钥只能放 GitHub Secrets，不得提交进仓库\n\n---\n\n## 30秒选边上车",
              ),
              (
                  "2. **开 Actions**：fork 后 GitHub 默认暂停 workflow，去 Actions 页点一下启用，`update-news.yml` 每30分钟自动跑。",
                  "2. **开 Actions**：fork 后 GitHub 默认暂停 workflow，去 Actions 页点一下启用；本 Fork 的 `update-news.yml` 每天北京时间 08:17 和 20:47 自动跑。",
              ),
              (
                  "- 默认每 30 分钟运行一次：`*/30 * * * *`",
                  "- 默认每天运行两次：`17 0 * * *`（北京时间 08:17）和 `47 12 * * *`（北京时间 20:47）",
              ),
              (
                  "- 如果没有设置 `FOLLOW_OPML_B64`，线上工作流会自动使用公开示例 `feeds/follow.example.opml`，让页面展示 RSS/OPML 能力",
                  "- 如果没有设置 `FOLLOW_OPML_B64`，线上工作流优先使用 `feeds/martin-ai-coding.example.opml`；该文件不存在时再回退到 `feeds/follow.example.opml`",
              ),
              (
                  "- `data/merge-log.json`：故事合并过程和命中记录，方便调试与审计",
                  "- `data/merge-log.json`：故事合并过程和命中记录，方便调试与审计\n- `data/creator-brief.json`：当前 AI Coding 早报或晚报\n- `data/creator-editions.json`：创作者版历史归档，供 `/creator/` 页面读取\n- `data/edition-state.json`：早晚版去重与状态迁移记录",
              ),
          ]

          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"README replacement marker count={count}: {old[:80]}")
              text = text.replace(old, new, 1)

          path.write_text(text, encoding="utf-8")
          PY

      - name: Commit README
        run: |
          if git diff --quiet -- README.md; then
            echo "No README changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "docs: document creator intelligence workflow"
          git push origin HEAD:feat/ai-coding-intelligence-v1
